name: Application QA Bench Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  qa-workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate application-specific QA Bench
        env:
          QA_BENCH_PATH: scopepilot/web/qa-bench.html
          QA_INDEX_PATH: scopepilot/web/index.html
          QA_BENCH_SCRIPT: 
        run: node --test qa/bench-validation.test.cjs
