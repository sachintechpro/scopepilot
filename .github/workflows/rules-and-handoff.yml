name: ScopePilot Rules and Handoff Automation
on:
  push:
    branches: [main]
    paths:
      - "scopepilot/**"
      - ".github/workflows/rules-and-handoff.yml"
  pull_request:
  workflow_dispatch:
jobs:
  automated-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run real isolated Python tests
        working-directory: scopepilot
        run: python -m unittest discover -s tests -v
